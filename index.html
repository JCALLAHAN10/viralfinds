<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViralFinds — trending finds, updated daily</title>
<meta name="description" content="Hand-picked trending products, refreshed daily.">
<style>
  :root { --bg:#0f0f13; --card:#1a1a22; --text:#f4f4f8; --muted:#9a9aa8; --accent:#ff4d6d; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:48px 20px 12px; text-align:center; }
  h1 { font-size:2rem; letter-spacing:-0.5px; }
  h1 span { color:var(--accent); }
  .tag { color:var(--muted); margin-top:8px; font-size:0.95rem; }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .soon { background:var(--card); border-radius:16px; padding:40px 28px; max-width:420px; text-align:center; }
  .soon h2 { font-size:1.3rem; margin-bottom:10px; }
  .soon p { color:var(--muted); line-height:1.5; }
  footer { padding:24px 20px 32px; text-align:center; color:var(--muted); font-size:0.78rem; line-height:1.6; }
</style>
</head>
<body>
<header>
  <h1>Viral<span>Finds</span></h1>
  <p class="tag">trending finds, updated daily</p>
</header>
<main>
<!-- PRODUCTS:START -->
  <div class="soon">
    <h2>First drop loading&hellip;</h2>
    <p>We're stocking the shelves with this week's trending picks. Check back soon — new finds land daily.</p>
  </div>
<!-- PRODUCTS:END -->
</main>
<footer>
  As an Amazon Associate we earn from qualifying purchases.<br>
  Prices and availability are accurate as of the time posted and may change.
</footer>
</body>
</html>
